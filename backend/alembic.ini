[alembic]
# Rutas relativas a este archivo, no a la carpeta actual.
script_location = %(here)s/app/db/migraciones
prepend_sys_path = %(here)s
path_separator = os
# Sin sqlalchemy.url: env.py la toma de DATABASE_URL, o del fixture de pruebas.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
